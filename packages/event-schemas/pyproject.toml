[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbz-event-schemas"
version = "0.0.0"
description = "Versioned JSON Schemas for BBZ domain events and the normalized telephony event model."
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22"]

[tool.setuptools.packages.find]
include = ["bbz_event_schemas*"]

[tool.setuptools.package-data]
bbz_event_schemas = ["py.typed", "schemas/*.json"]
