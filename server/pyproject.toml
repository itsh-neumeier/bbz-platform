[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbz-core"
version = "0.0.0"
description = "BBZ / 3-S-Zentrale platform core service (bbz-api). Foundation skeleton."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<0.31",
  "psycopg[binary]>=3.2,<4.0",
  "argon2-cffi>=23.1,<26.0",
  "pyjwt>=2.9,<3.0",
  "pyotp>=2.9,<3.0",
  "ldap3>=2.9.1,<3.0",
  "pyasn1>=0.6.4,<0.7",  # CVE fixes (PYSEC-2026-3455/3456/3457); ldap3 2.9.1's
  # deprecated tagMap/typeMap import is filtered in [tool.pytest] filterwarnings
  "webauthn>=3.0,<4",  # FIDO2/WebAuthn L2 (E21-06); pulls cbor2, pyasn1-modules, pyOpenSSL
  "cryptography>=46.0.7,<51",
  "structlog>=24.1",
  "prometheus-client>=0.20,<1.0",
  "bbz-integration-sdk",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools.packages.find]
include = ["bbz_core*"]

[tool.setuptools.package-data]
bbz_core = ["py.typed"]
