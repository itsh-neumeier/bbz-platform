# Developer convenience stack (single node). NOT the production topology —
# per-node HA composition (Patroni + 3x etcd + 2 app nodes) lives in deploy/ and
# is built in Phase 2 (ADR-0001, ADR-0018).
#
#   docker compose --profile core up --build
#
name: bbz-platform

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bbz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bbz}
      POSTGRES_DB: ${POSTGRES_DB:-bbz}
    ports: ["5432:5432"]
    volumes: ["bbz_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbz}"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.16
    profiles: ["core"]
    command: >
      /usr/local/bin/etcd
      --name bbz-etcd-dev
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
    ports: ["2379:2379"]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    profiles: ["core"]
    environment:
      BBZ_ENVIRONMENT: local
      BBZ_NODE_ID: BBZ-DEV01
      BBZ_LOG_JSON: "true"
      BBZ_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bbz}:${POSTGRES_PASSWORD:-bbz}@postgres:5432/${POSTGRES_DB:-bbz}
      BBZ_CLUSTER_DCS: etcd
      BBZ_CLUSTER_DCS_ENDPOINTS: '["http://etcd:2379"]'
      # single dev node -> local always-leader election; run the singletons here
      BBZ_RUN_BACKGROUND_WORKERS: "true"
      # the Vite dev server proxies with changeOrigin, so the browser's
      # Origin (:5173) never matches the forwarded Host — allow it explicitly
      # so CsrfMiddleware (E23-05) passes cookie-authed writes from the SPA.
      BBZ_CORS_ALLOW_ORIGINS: '["http://localhost:5173"]'
    ports: ["8000:8000"]
    # container hardening (E23-08). The image already runs as uid 10001; lock the
    # rest down. read_only works because the app only ever writes to stdout.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    profiles: ["core"]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes: ["./apps/web:/app"]
    ports: ["5173:5173"]
    depends_on: ["api"]

  reverse-proxy:
    image: caddy:2-alpine
    profiles: ["edge"]
    ports: ["8443:8443"]
    volumes: ["./deploy/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: ["api", "web"]

  # --- optional local observability stack (E22-07). Opt-in, never on quorum. ---
  #   docker compose --profile core --profile monitoring up
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    profiles: ["monitoring"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/monitoring/collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "13133:13133"]

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts:/etc/prometheus/rules:ro
      - ./deploy/monitoring/prometheus/secrets:/etc/prometheus/secrets:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: ["prometheus"]

volumes:
  bbz_pg:
