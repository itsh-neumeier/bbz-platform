version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: "/server"
    schedule: { interval: weekly }
