version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
    ignore:
      # TypeScript is held at 5.x — typescript-eslint's peer range caps it below
      # the next major (see #14, the frontend major-upgrade pass). A TS major
      # needs a coordinated typescript-eslint / vue-tsc bump first; until then
      # a grouped major bump just breaks `npm ci` with ERESOLVE (#800).
      # Minor/patch updates still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: "/server"
    schedule: { interval: weekly }
