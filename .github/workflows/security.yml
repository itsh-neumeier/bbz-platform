name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  # Gate: every scanner exception in deploy/security/scan-exceptions.toml must
  # carry a reason and a future expiry (≤ 90 days). An expired one fails here,
  # which re-arms the finding in the scans below (E23-07).
  scan-policy:
    name: scan-exception policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/security/check_scan_exceptions.py --check

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

  python-audit:
    name: pip-audit
    needs: scan-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # Audit third-party dependencies strictly. The repo's own packages are
      # installed editable and are not on PyPI, so exclude them from the set.
      # Any curated, unexpired exceptions are passed as --ignore-vuln.
      - run: |
          pip freeze --exclude-editable > audit-requirements.txt
          IGNORE=$(python tools/security/check_scan_exceptions.py --pip-audit-args)
          echo "pip-audit exceptions: ${IGNORE:-<none>}"
          pip-audit --strict -r audit-requirements.txt --progress-spinner off $IGNORE

  filesystem-scan:
    name: trivy fs
    needs: scan-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Scan
        run: |
          python3 tools/security/check_scan_exceptions.py --trivyignore > .trivyignore
          echo "--- .trivyignore ---"; cat .trivyignore
          trivy fs --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed --no-progress \
            --ignorefile .trivyignore .

  # Every self-built image must run as a non-root user (E23-08). Static check on
  # all Dockerfiles + the real answer from `docker inspect` on the built api image.
  nonroot-images:
    name: non-root images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/security/check_dockerfiles.py
      - name: Build + inspect the api image
        run: |
          docker build -f server/Dockerfile -t bbz-api:ci .
          user=$(docker inspect --format '{{.Config.User}}' bbz-api:ci)
          echo "api image Config.User = '${user}'"
          case "${user%%:*}" in
            ""|root|0) echo "::error::api image runs as root"; exit 1 ;;
          esac

  # apps/web npm advisories: informational only until #14 (the deliberate
  # frontend major-upgrade pass) lands a clean tree. E23-07 makes it a gate then
  # — drop the `|| true` and this comment.
  web-audit:
    name: npm audit (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: apps/web
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high || echo "::warning::npm audit findings — gated after #14"
