name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint · type · imports · test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bbz
          POSTGRES_PASSWORD: bbz
          POSTGRES_DB: bbz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bbz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BBZ_ENVIRONMENT: ci
      BBZ_DATABASE_URL: postgresql+asyncpg://bbz:bbz@localhost:5432/bbz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy server/bbz_core packages/integration-sdk/bbz_integration_sdk packages/rule-dsl/bbz_rule_dsl packages/event-schemas/bbz_event_schemas
      - name: Import boundaries
        run: lint-imports
      - name: Pytest
        run: pytest --cov --cov-report=term-missing
      - name: Alembic upgrade/downgrade/upgrade (real PostgreSQL)
        run: |
          cd server
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  migration-compat:
    name: migration compat (N-1 app × N schema)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bbz
          POSTGRES_PASSWORD: bbz
          POSTGRES_DB: bbz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bbz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BBZ_ENVIRONMENT: ci
      BBZ_DATABASE_URL: postgresql+asyncpg://bbz:bbz@localhost:5432/bbz
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Migrate a fresh DB to the new head
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/integration-sdk ./packages/rule-dsl ./packages/event-schemas ./server
          (cd server && alembic upgrade head)
      - name: Install the previous app version in its own venv
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD^' }}"
          git worktree add ../prev "$BASE"
          python -m venv /tmp/prev
          /tmp/prev/bin/pip install --quiet --upgrade pip
          /tmp/prev/bin/pip install --quiet \
            ../prev/packages/integration-sdk ../prev/packages/rule-dsl \
            ../prev/packages/event-schemas ../prev/server
      - name: The previous app version must still read the new schema
        run: /tmp/prev/bin/python tools/check_migration_compat.py

  frontend:
    name: frontend (lint · type · unit)
    runs-on: ubuntu-latest
    # The frontend toolchain is scaffolded but not yet verified end-to-end (the
    # foundation commit was produced without Node). Kept non-blocking until the
    # first apps/web feature PR hardens it — see PR #2 "Known limitations".
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  commitlint:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Install locally so @commitlint/resolve-extends finds config-conventional.
      - run: npm install --no-save --no-package-lock @commitlint/cli@19 @commitlint/config-conventional@19
      - run: >-
          npx commitlint --config .commitlintrc.json
          --from ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to HEAD

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: dev stack
        run: |
          cp .env.example .env
          docker compose --profile core --profile edge --profile monitoring config -q
      - name: deploy/node stack
        working-directory: deploy/node
        run: |
          cp .env.example .env
          for f in secrets/*.example; do cp "$f" "${f%.example}"; done
          docker compose config -q
      - name: deploy/quorum stack
        working-directory: deploy/quorum
        run: |
          cp .env.example .env
          docker compose config -q
          # the witness runs etcd ONLY — no BBZ domain services (E06-08)
          services=$(docker compose config --services | sort | tr '\n' ' ')
          test "$services" = "etcd " || { echo "quorum services: $services"; exit 1; }
      - name: deploy/ha-test harness
        working-directory: deploy/ha-test
        run: docker compose -f compose.yml config -q
      - name: Caddyfiles are valid + formatted (E06-12)
        run: |
          for cf in deploy/node/reverse-proxy/Caddyfile deploy/reverse-proxy/Caddyfile deploy/ha-test/Caddyfile; do
            echo "== $cf =="
            docker run --rm -e BBZ_PUBLIC_NAME=bbz.ci.internal -v "$PWD/$cf:/w/Caddyfile:ro" -w /w \
              caddy:2-alpine sh -c "caddy validate --config Caddyfile && diff -u Caddyfile <(caddy fmt Caddyfile)"
          done
      - name: Prometheus alert rules are valid + tested (E22-06)
        run: |
          docker run --rm -v "$PWD/deploy/monitoring/alerts:/rules:ro" -w /rules \
            --entrypoint promtool prom/prometheus:v3.1.0 check rules bbz.rules.yml
          docker run --rm -v "$PWD/deploy/monitoring/alerts:/rules:ro" -w /rules \
            --entrypoint promtool prom/prometheus:v3.1.0 test rules bbz.rules.test.yml
      - name: Observability stack config is valid (E22-07)
        run: |
          docker run --rm \
            -v "$PWD/deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/monitoring/alerts:/etc/prometheus/rules:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/deploy/monitoring/collector/otel-collector-config.yaml:/cfg.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.119.0 validate --config=/cfg.yaml
