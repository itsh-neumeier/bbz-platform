name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint · type · imports · test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bbz
          POSTGRES_PASSWORD: bbz
          POSTGRES_DB: bbz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bbz"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BBZ_ENVIRONMENT: ci
      BBZ_DATABASE_URL: postgresql+asyncpg://bbz:bbz@localhost:5432/bbz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy server/bbz_core packages/integration-sdk/bbz_integration_sdk packages/rule-dsl/bbz_rule_dsl packages/event-schemas/bbz_event_schemas
      - name: Import boundaries
        run: lint-imports
      - name: Pytest
        run: pytest --cov --cov-report=term-missing
      - name: Alembic upgrade/downgrade/upgrade (real PostgreSQL)
        run: |
          cd server
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: frontend (lint · type · unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  commitlint:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes @commitlint/cli@19 --config .commitlintrc.json --from ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to HEAD

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile core --profile edge config
