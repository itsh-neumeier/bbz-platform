; BBZ SIP lab — module load policy (E13-08).
; autoload keeps this short and robust across Asterisk point releases; ARI +
; Stasis + chan_pjsip + pbx_config all come in that way. Only trim the noise.
[modules]
autoload = yes

; deprecated / removed SIP stack — chan_pjsip is the one we use
noload => chan_sip.so
; no call-detail-record backends in a throwaway lab
noload => cdr_csv.so
noload => cdr_custom.so
noload => cel_custom.so
