; BBZ SIP lab — RTP for the WebRTC operator softphone (E13-11 / ADR-0035).
;
; LAB ONLY. A tight port range that docker-compose.yml PUBLISHES to the host, so
; a browser running on the Docker host can actually reach our media ports — the
; container IP Asterisk would otherwise offer as its ICE candidate is not
; routable from the host on Docker Desktop. entrypoint.sh appends an
; [ice_host_candidates] mapping (<container-ip> => 127.0.0.1) at start so the
; browser is handed a reachable candidate.
;
; A real BBZ site runs Asterisk on a host with a real address and needs none of
; this.
[general]
rtpstart=20000
rtpend=20003
icesupport=yes
; entrypoint.sh appends `turnaddr` / `turnusername` / `turnpassword` when a
; `coturn` service is on the network (#834) so Asterisk relays media through
; the same TURN server the browser uses.
