; BBZ SIP lab dialplan (E13-08).
;
; Two contexts are all the integration tests need:
;   [bbz-sip]  the Stasis entry — the `telephony_sip` adapter originates with
;              context = its app_name ("bbz-sip"), so a matching context hands
;              every call straight to the Stasis app the pump listens on.
;   [bbz-lab]  a holding context — Answer + Wait keeps the far leg of a Local
;              channel up so the test can drive the near (Stasis) leg over ARI.

[globals]

[bbz-sip]
exten => _X.,1,NoOp(BBZ lab: ${EXTEN} -> Stasis(bbz-sip))
 same => n,Set(SIPCALLID=${CHANNEL(pjsip,call-id)})
 same => n,Stasis(bbz-sip,${EXTEN})
 same => n,Hangup()
; a call that leaves Stasis without a continue-in-dialplan just ends
exten => h,1,NoOp(BBZ lab: hangup ${CHANNEL})

[bbz-lab]
; the number is irrelevant — everything parks and waits for ARI to hang it up
exten => _X.,1,Answer()
 same => n,Wait(3600)
 same => n,Hangup()
exten => park,1,Answer()
 same => n,Wait(3600)
 same => n,Hangup()
