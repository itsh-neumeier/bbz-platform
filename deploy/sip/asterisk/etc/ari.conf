; BBZ SIP lab — ARI (Asterisk REST Interface).
;
; The credential below is a well-known THROWAWAY for the E13-08 integration
; tests only (see deploy/sip/README.md). A real deployment creates its own ARI
; user and BBZ stores it encrypted at rest, entered from the admin UI (ADR-0033)
; — it is never committed anywhere.
[general]
enabled = yes
pretty = yes
; the lab is not browser-facing; * keeps the WebSocket handshake simple
allowed_origins = *
; surface the SIP Call-ID on channel/event payloads so the adapter's event
; mapper can use it as a stable source_call_id (E13-04). The dialplan sets it
; from ${CHANNEL(pjsip,call-id)} before Stasis(); empty for Local channels,
; where the mapper falls back to the ARI channel id.
channelvars = SIPCALLID

[bbz-lab]
type = user
read_only = no
password = bbz-lab-not-a-secret
password_format = plain
