; BBZ SIP lab — the built-in HTTP server that carries ARI (REST + the event
; WebSocket at /ari/events). Plain HTTP: the lab is single-host and never
; exposed. A production Asterisk terminates TLS here (ADR-0033 `tls: true`).
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
; ARI needs the WebSocket upgrade
websocket_enabled = yes
