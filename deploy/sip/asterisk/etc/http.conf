; BBZ SIP lab — the built-in HTTP server that carries ARI (REST + the event
; WebSocket at /ari/events) and the SIP-over-WebSocket transport for the
; operator softphone (E13-11 / ADR-0035).
;
; Plain HTTP for ARI on :8088 (the lab is single-host and never exposed).
; TLS on :8089 for `wss://` — WebRTC requires a secure transport. The cert is
; the self-signed one generated in the image (LAB ONLY). A production Asterisk
; terminates TLS here with a real cert (ADR-0033 `tls: true`, ADR-0035).
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
; ARI + SIP both need the WebSocket upgrade
websocket_enabled = yes
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/asterisk/keys/asterisk.crt
tlsprivatekey = /etc/asterisk/keys/asterisk.key
