; BBZ SIP lab — a minimal but real chan_pjsip config so the lab is an actual
; SIP PBX, not only Local channels. The E13-08 integration tests drive calls
; through ARI over Local channels; this endpoint exists for the
; registration-loss scenario and for manual softphone testing.
;
; Credentials are the same lab throwaway as ari.conf (see deploy/sip/README.md).

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; SIP-over-WebSocket-Secure for the operator softphone (E13-11 / ADR-0035) is
; defined in the BBZ-generated config below (the [transport-wss] section appears
; once an operator endpoint exists). The TLS listener + cert live in http.conf
; (:8089). No base [transport-wss] here — a softphone only registers once it has
; credentials, and by then the sync has written the generated file.

; BBZ-generated SIP trunks + WebRTC operator endpoints (ADR-0034 / 0035) —
; written by sync-trunk-config.sh, absent until configured. #tryinclude is
; silent when the file is missing.
#tryinclude pjsip_bbz_trunks.conf

[bbz-lab-phone]
type = endpoint
context = bbz-sip
disallow = all
allow = ulaw,alaw
aors = bbz-lab-phone
auth = bbz-lab-phone
direct_media = no

[bbz-lab-phone]
type = auth
auth_type = userpass
username = bbz-lab-phone
password = bbz-lab-not-a-secret

[bbz-lab-phone]
type = aor
max_contacts = 1
remove_existing = yes
