# deploy/quorum — BBZ-QUORUM01. The witness host runs an etcd member ONLY.
# NO BBZ domain services run here (MASTER_PROMPT §20, ADR-0018): its single job
# is to make the etcd cluster an odd number of voters so Patroni can decide a
# PostgreSQL failover without split brain.
#
#   cd deploy/quorum
#   cp .env.example .env      # then edit
#   docker compose up -d
#
# The 3-member cluster join (SRV01 + SRV02 + QUORUM01) and mutual TLS are wired
# in E06-03 (#84).
name: bbz-quorum

services:
  etcd:
    restart: unless-stopped
    image: gcr.io/etcd-development/etcd:v3.5.16
    command:
      - /usr/local/bin/etcd
      - --name=${BBZ_NODE_ID:?set in .env}
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${ETCD_ADVERTISE_HOST:?set in .env}:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://${ETCD_ADVERTISE_HOST}:2380
      - --initial-cluster=${ETCD_INITIAL_CLUSTER:?set in .env}
      - --initial-cluster-state=${ETCD_INITIAL_CLUSTER_STATE:-new}
      - --initial-cluster-token=${ETCD_CLUSTER_TOKEN:-bbz-etcd}
    volumes:
      - etcd_data:/etcd-data
    ports:
      - "2379:2379"
      - "2380:2380"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  etcd_data:
