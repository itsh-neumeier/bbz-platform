# deploy/quorum — BBZ-QUORUM01. The witness host runs an etcd member ONLY.
# NO BBZ domain services run here (MASTER_PROMPT §20/§2, ADR-0018): its single
# job is to make the etcd cluster an odd number of voters (2 of 3 = quorum) so
# Patroni can decide a PostgreSQL failover without split brain — a third vote
# with zero data risk.
#
#   cd deploy/quorum
#   cp .env.example .env      # then edit
#   docker compose up -d
#
# Certificates come from deploy/etcd/gen-certs.sh (run once on a trusted host);
# copy ca.crt + BBZ-QUORUM01-{peer,server}.{crt,key} into ./etcd/certs.
# Hardening checklist: HARDENING.md. Runbook: docs/runbooks/quorum-node.md.
name: bbz-quorum

services:
  etcd:
    restart: unless-stopped
    image: gcr.io/etcd-development/etcd:v3.5.16
    read_only: true               # only the data volume is writable
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    environment:
      ETCDCTL_CACERT: /etc/etcd/certs/ca.crt
      ETCDCTL_CERT: /etc/etcd/certs/${BBZ_NODE_ID}-server.crt
      ETCDCTL_KEY: /etc/etcd/certs/${BBZ_NODE_ID}-server.key
    command:
      - /usr/local/bin/etcd
      - --name=${BBZ_NODE_ID:?set in .env}
      - --data-dir=/etcd-data
      - --initial-cluster=${ETCD_INITIAL_CLUSTER:?set in .env}
      - --initial-cluster-state=${ETCD_INITIAL_CLUSTER_STATE:-new}
      - --initial-cluster-token=${ETCD_CLUSTER_TOKEN:-bbz-etcd}
      - --listen-client-urls=https://0.0.0.0:2379
      - --advertise-client-urls=https://${ETCD_ADVERTISE_HOST:?set in .env}:2379
      - --listen-peer-urls=https://0.0.0.0:2380
      - --initial-advertise-peer-urls=https://${ETCD_ADVERTISE_HOST}:2380
      - --cert-file=/etc/etcd/certs/${BBZ_NODE_ID}-server.crt
      - --key-file=/etc/etcd/certs/${BBZ_NODE_ID}-server.key
      - --trusted-ca-file=/etc/etcd/certs/ca.crt
      - --client-cert-auth
      - --peer-cert-file=/etc/etcd/certs/${BBZ_NODE_ID}-peer.crt
      - --peer-key-file=/etc/etcd/certs/${BBZ_NODE_ID}-peer.key
      - --peer-trusted-ca-file=/etc/etcd/certs/ca.crt
      - --peer-client-cert-auth
      # Prometheus scrapes /metrics here (plaintext, LAN-only). The monitoring
      # stack itself is Epic 22.
      - --listen-metrics-urls=http://0.0.0.0:2381
    volumes:
      - etcd_data:/etcd-data
      - ./etcd/certs:/etc/etcd/certs:ro
    ports:
      # bind to the host's internal interface only (edit ${QUORUM_BIND})
      - "${QUORUM_BIND:-0.0.0.0}:2379:2379"
      - "${QUORUM_BIND:-0.0.0.0}:2380:2380"
      - "${QUORUM_BIND:-0.0.0.0}:2381:2381"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  etcd_data:
