# deploy/ha-test — a single-host mini HA cluster for the failure-scenario
# harness (roadmap E06-11, MASTER_PROMPT §24). NOT a production topology and
# NOT the dev stack: two app nodes, a Patroni-managed primary/standby, a
# 3-member etcd, and a Caddy load balancer in front of the two APIs.
#
#   cd deploy/ha-test
#   docker compose up -d --build
#   ./run.sh                 # runs every scenario in scenarios/
#
# etcd runs plaintext here on purpose — the harness exercises *failover
# behaviour*, not transport security (that is deploy/node + test_deploy_topology).
name: bbz-ha-test

x-etcd: &etcd
  image: gcr.io/etcd-development/etcd:v3.5.16
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "etcdctl", "endpoint", "health"]
    interval: 3s
    timeout: 2s
    retries: 10

x-api: &api
  build:
    context: ../..
    dockerfile: server/Dockerfile
  restart: unless-stopped
  volumes:
    - ./seed.py:/seed.py:ro
  environment: &api-env
    BBZ_ENVIRONMENT: ci
    BBZ_LOG_JSON: "true"
    BBZ_JWT_SECRET: ha-test-secret-at-least-32-bytes-long-ok!!
    BBZ_SESSION_COOKIE_SECURE: "false"
    BBZ_CLUSTER_DCS: etcd
    BBZ_CLUSTER_DCS_ENDPOINTS: '["http://etcd1:2379","http://etcd2:2379","http://etcd3:2379"]'
    BBZ_WORKER_LEADER_BACKEND: etcd
    BBZ_RUN_BACKGROUND_WORKERS: "true"
    BBZ_PATRONI_REST_ENDPOINTS: '["http://pg1:8008","http://pg2:8008"]'
    # both APIs talk to the DB through HAProxy, which routes 5432 to whichever
    # Patroni node currently answers GET /primary with 200 (the standard
    # Patroni + HAProxy pattern). A failover just moves the backend.
    BBZ_DATABASE_URL: postgresql+asyncpg://postgres:htest@pgha:5432/postgres

services:
  etcd1: { <<: *etcd, container_name: ha-etcd1, command: &e1 [
    "/usr/local/bin/etcd", "--name=etcd1", "--data-dir=/data",
    "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd1:2379",
    "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd1:2380",
    "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380",
    "--initial-cluster-state=new", "--initial-cluster-token=ha"] }
  etcd2: { <<: *etcd, container_name: ha-etcd2, command: [
    "/usr/local/bin/etcd", "--name=etcd2", "--data-dir=/data",
    "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd2:2379",
    "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd2:2380",
    "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380",
    "--initial-cluster-state=new", "--initial-cluster-token=ha"] }
  # etcd3 is the witness (would live on BBZ-QUORUM01)
  etcd3: { <<: *etcd, container_name: ha-etcd3, command: [
    "/usr/local/bin/etcd", "--name=etcd3", "--data-dir=/data",
    "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd3:2379",
    "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd3:2380",
    "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380",
    "--initial-cluster-state=new", "--initial-cluster-token=ha"] }

  pg1: &pg
    image: ghcr.io/zalando/spilo-16:3.3-p1
    restart: unless-stopped
    environment: &pg-env
      SCOPE: hatest
      PGVERSION: "16"
      ETCD3_HOSTS: '"etcd1:2379","etcd2:2379","etcd3:2379"'
      PATRONI_NAME: pg1
      PATRONI_SUPERUSER_PASSWORD: htest
      PATRONI_REPLICATION_PASSWORD: htest
      PATRONI_admin_PASSWORD: htest
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
      PATRONI_SYNCHRONOUS_MODE: "true"
      PATRONI_SYNCHRONOUS_MODE_STRICT: "false"
    depends_on:
      etcd1: { condition: service_healthy }
      etcd2: { condition: service_healthy }
      etcd3: { condition: service_healthy }
  pg2:
    <<: *pg
    environment:
      <<: *pg-env
      PATRONI_NAME: pg2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008

  # Patroni-aware DB router: 5432 -> current primary, 5433 -> replicas
  pgha:
    image: haproxy:2.9-alpine
    container_name: ha-pgha
    restart: unless-stopped
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on: [pg1, pg2]

  api1:
    <<: *api
    container_name: ha-api1
    environment:
      <<: *api-env
      BBZ_NODE_ID: HA-SRV01
    ports:
      - "8081:8000"
    depends_on: [pgha]
    command: >-
      sh -c "sleep 30 && alembic upgrade head 2>/dev/null; python -m bbz_core.main"
  api2:
    <<: *api
    container_name: ha-api2
    environment:
      <<: *api-env
      BBZ_NODE_ID: HA-SRV02
    ports:
      - "8082:8000"
    depends_on: [api1]
    command: >-
      sh -c "sleep 40 && python -m bbz_core.main"

  lb:
    image: caddy:2-alpine
    container_name: ha-lb
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:8080"
    depends_on: [api1, api2]
